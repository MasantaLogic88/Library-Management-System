<!doctype html>
<html lang="en">

<head>

    <!-- Required meta tags -->

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">


    <!-- Bootstrap CSS -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
        integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
        crossorigin="anonymous">


    <title>Sign in</title>

</head>


<body>


    <!-- Navigation Bar -->

    <div class="fluid-container">

        <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-primary">


            <a class="navbar-brand"
                href="index.htm">

                <img src="Image/Logo.png"
                    width="140"
                    height="80"
                    alt="Library Management System Logo">

            </a>


            <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                id="navbarSupportedContent">


                <ul class="navbar-nav mr-auto">


                    <li class="nav-item active">

                        <a class="nav-link"
                            href="index.htm">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                            href="ABOUT.HTML">

                            About

                        </a>

                    </li>


                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                            href="#"
                            id="navbarDropdown"
                            role="button"
                            data-toggle="dropdown"
                            aria-expanded="false">

                            Registration

                        </a>


                        <div class="dropdown-menu"
                            aria-labelledby="navbarDropdown">


                            <a class="dropdown-item"
                                href="STUDENTFORM.HTML">

                                Student Registration

                            </a>


                            <a class="dropdown-item"
                                href="COLLEGEFORM.HTML">

                                College Registration

                            </a>


                            <a class="dropdown-item"
                                href="TEACHER-FORM.HTML">

                                Teacher Registration

                            </a>


                        </div>

                    </li>


                </ul>

            </div>

        </nav>

    </div>


    <br>
    <br>
    <br>
    <br>
    <br>
    <br>


    <!-- Sign In Section -->


    <div class="container heading_1">

        <div class="row">


            <!-- Login Image -->

            <div class="col-md-6">

                <div class="card">

                    <img src="Image/blue-login-icon.jpg"
                        width="100%"
                        height="100%"
                        alt="Library Management System Login"
                        class="card hover">

                </div>

            </div>


            <!-- Login Form -->

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">


                        <h1 style="color:#0d6efd">

                            Sign In

                        </h1>


                        <br>


                        <p>

                            Registered users can login using
                            roll number and password from here.

                        </p>


                        <br>


                        <form id="loginForm">


                            <!-- Roll Number -->

                            <div class="form-group">

                                <label for="rollNumber">

                                    Enter Roll number / ID number

                                </label>


                                <input type="text"
                                    class="form-control"
                                    id="rollNumber"
                                    placeholder="Enter Roll Number"
                                    required>

                            </div>


                            <br>


                            <!-- Password -->

                            <div class="form-group">

                                <label for="password">

                                    Enter Password

                                </label>


                                <input type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter Password"
                                    required>

                            </div>


                            <br>


                            <!-- Sign In Button -->

                            <button type="submit"
                                class="btn btn-primary">

                                Sign in

                            </button>


                            <br>
                            <br>


                            <!-- Login Message -->

                            <p id="loginMessage"
                                style="
                                font-weight:bold;
                                text-align:center;
                                ">

                            </p>


                        </form>


                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Login JavaScript -->


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener("submit", async function(event)
        {
            event.preventDefault();


            const rollNumber =
                document.getElementById("rollNumber").value;


            const password =
                document.getElementById("password").value;


            const loginMessage =
                document.getElementById("loginMessage");


            loginMessage.textContent =
                "Checking login...";

            loginMessage.style.color =
                "black";


            try
            {
                const response =
                    await fetch(
                        "https://library-management-system-osleoya9c-ritesh-masanta.vercel.app/api/students/login",
                        {
                            method: "POST",

                            headers:
                            {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    rollNumber: rollNumber,
                                    password: password
                                })
                        }
                    );


                const result =
                    await response.json();


                if (response.ok)
                {
                    loginMessage.textContent =
                        "Login successful! Welcome "
                        + result.student.firstName
                        + " "
                        + result.student.lastName
                        + ".";


                    loginMessage.style.color =
                        "green";


                    console.log(
                        "Logged in student:",
                        result.student
                    );
                }
                else
                {
                    loginMessage.textContent =
                        result.message ||
                        "Invalid roll number or password";


                    loginMessage.style.color =
                        "red";
                }

            }
            catch (error)
            {
                console.error(
                    "Login error:",
                    error
                );


                loginMessage.textContent =
                    "Unable to connect to the server.";


                loginMessage.style.color =
                    "red";
            }

        });

    </script>


    <!-- jQuery -->

    <script
        src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous">
    </script>


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-fQybjgWLrvvRgtW6bFlB7jaZrFsaBXjsOM/tB9LTS58ONXgqbR9W8oWht/amnpF"
        crossorigin="anonymous">
    </script>


</body>

</html>

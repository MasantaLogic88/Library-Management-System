<!doctype html>
<html lang="en">

<head>

    <!-- Required meta tags -->

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">


    <!-- Bootstrap CSS -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
        integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
        crossorigin="anonymous">


    <title>Search Books</title>

</head>


<body>


    <!-- Navigation Bar -->


    <div class="fluid-container">


        <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-primary">


            <a class="navbar-brand"
                href="index.htm">

                <img src="Image/Logo.png"
                    width="140"
                    height="80"
                    alt="logo">

            </a>


            <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">


                <span class="navbar-toggler-icon"></span>


            </button>


            <div class="collapse navbar-collapse"
                id="navbarSupportedContent">


                <ul class="navbar-nav mr-auto">


                    <li class="nav-item active">


                        <a class="nav-link"
                            href="index.htm">

                            Home

                            <span class="sr-only">
                                (current)
                            </span>

                        </a>


                    </li>


                    <li class="nav-item">


                        <a class="nav-link"
                            href="ABOUT.HTML">

                            About

                        </a>


                    </li>


                    <li class="nav-item">


                        <a class="nav-link"
                            href="CONTACT.HTML">

                            Contact

                        </a>


                    </li>


                </ul>


            </div>


        </nav>


    </div>


    <!-- Page Heading -->


    <div class="fluid-container">


        <div class="row">


            <div class="col-md-12">


                <h1 style="margin-top:8%;
                    background-color:powderblue;
                    color:black;
                    padding:60px;
                    text-align:center"
                    class="heading_1">

                    Search Books

                </h1>


            </div>


        </div>


    </div>


    <br>
    <br>
    <br>


    <!-- Search Form -->


    <div class="container heading_1">


        <div class="row">


            <!-- Image -->


            <div class="col-md-6">


                <div class="card">


                    <img src="Image/Search-Book.jfif"
                        width="100%"
                        height="100%"
                        alt="Library Management System Image"
                        class="card-img-top">


                </div>


            </div>


            <!-- Search Form -->


            <div class="col-md-6">


                <div class="card">


                    <div class="card-body">


                        <p>

                            Search registered books using
                            subject, book number or book name.

                        </p>


                        <br>


                        <form id="searchBookForm"
                            style="margin-left:5%">


                            <!-- Subject -->


                            <div class="form-group">


                                <label for="subject">

                                    Enter Subject

                                </label>


                                <input type="text"
                                    class="form-control"
                                    id="subject"
                                    placeholder="Enter Subject">


                            </div>


                            <!-- Book Number -->


                            <div class="form-group">


                                <label for="bookNumber">

                                    Enter Book Number

                                </label>


                                <input type="text"
                                    class="form-control heading_1"
                                    id="bookNumber"
                                    placeholder="Enter Book Number">


                            </div>


                            <!-- Book Name -->


                            <div class="form-group">


                                <label for="bookName">

                                    Enter Book Name

                                </label>


                                <input type="text"
                                    class="form-control heading_1"
                                    id="bookName"
                                    placeholder="Enter Book Name">


                            </div>


                            <br>


                            <!-- Search Button -->


                            <center>


                                <button type="submit"
                                    class="btn btn-primary">

                                    Search Book

                                </button>


                            </center>


                        </form>


                        <br>


                        <!-- Search Message -->


                        <div id="searchMessage">
                        </div>


                        <!-- Search Results -->


                        <div id="searchResults">
                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPHlsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous">
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-fQybjgWLrvvRgtW6bFlbFl7jaZrFsaBXjsOMm/tB9LTS58ONXgqbR9W8oWht/amnpF"
        crossorigin="anonymous">
    </script>


    <!-- Book Search JavaScript -->


    <script>


        const searchBookForm =
            document.getElementById(
                "searchBookForm"
            );


        searchBookForm.addEventListener(
            "submit",
            async function(event)
            {

                event.preventDefault();


                const subject =
                    document.getElementById(
                        "subject"
                    ).value.trim();


                const bookNumber =
                    document.getElementById(
                        "bookNumber"
                    ).value.trim();


                const bookName =
                    document.getElementById(
                        "bookName"
                    ).value.trim();


                const message =
                    document.getElementById(
                        "searchMessage"
                    );


                const results =
                    document.getElementById(
                        "searchResults"
                    );


                if
                (
                    !subject &&
                    !bookNumber &&
                    !bookName
                )
                {

                    message.innerHTML =
                        '<div class="alert alert-warning">' +
                        'Please enter a subject, book number, ' +
                        'or book name.' +
                        '</div>';

                    results.innerHTML = "";

                    return;
                }


                message.innerHTML =
                    '<div class="alert alert-info">' +
                    'Searching books...' +
                    '</div>';


                results.innerHTML = "";


                try
                {

                    const params =
                        new URLSearchParams();


                    if (subject)
                    {
                        params.append(
                            "subject",
                            subject
                        );
                    }


                    if (bookNumber)
                    {
                        params.append(
                            "bookNumber",
                            bookNumber
                        );
                    }


                    if (bookName)
                    {
                        params.append(
                            "bookName",
                            bookName
                        );
                    }


                    const response =
                        await fetch(
                            "https://library-management-system-osleoya9c-ritesh-masanta.vercel.app/api/books?" +
                            params.toString()
                        );


                    const data =
                        await response.json();


                    if (!response.ok)
                    {

                        throw new Error(
                            data.message ||
                            "Book search failed"
                        );

                    }


                    message.innerHTML =
                        '<div class="alert alert-success">' +
                        data.count +
                        ' book(s) found.' +
                        '</div>';


                    if (data.books.length === 0)
                    {

                        results.innerHTML =
                            '<div class="alert alert-warning">' +
                            'No books found.' +
                            '</div>';

                        return;
                    }


                    let html = "";


                    data.books.forEach(
                        function(book)
                        {

                            html +=
                                '<div class="card mb-3">' +

                                '<div class="card-body">' +

                                '<h5 class="card-title">' +
                                (book.bookName || "No Book Name") +
                                '</h5>' +

                                '<p class="card-text">' +

                                '<strong>Book Number:</strong> ' +
                                (book.bookNumber || "N/A") +

                                '<br>' +

                                '<strong>Subject:</strong> ' +
                                (book.subject || "N/A") +

                                '<br>' +

                                '<strong>Author:</strong> ' +
                                (book.author || "N/A") +

                                '<br>' +

                                '<strong>Available:</strong> ' +
                                (book.available !== undefined
                                    ? book.available
                                    : "N/A") +

                                '</p>' +

                                '</div>' +

                                '</div>';

                        }
                    );


                    results.innerHTML = html;


                }
                catch (error)
                {

                    console.error(error);


                    message.innerHTML =
                        '<div class="alert alert-danger">' +
                        'Unable to connect to the backend. ' +
                        'Make sure the server is running on port 5001.' +
                        '</div>';

                }

            }
        );


    </script>


</body>

</html>
